# Local development
#   docker compose up -d db              → PostgreSQL only (run the API with `npm run dev`)
#   docker compose --profile app up -d   → PostgreSQL + the API container on http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secureaccess
    ports:
      - "5433:5432" # host 5433 avoids clashing with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/secureaccess?schema=public
      JWT_SECRET: ${JWT_SECRET:-docker-local-secret-change-me-0123456789abcdef}
      OIDC_PRIVATE_KEY: ${OIDC_PRIVATE_KEY:-}
      PUBLIC_URL: http://localhost:4000
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!Local#2026}
    ports:
      - "4000:4000"

volumes:
  pgdata:
